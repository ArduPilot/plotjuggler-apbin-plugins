name: Build PlotJuggler 4 plugin
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

env:
  # Export and restore Conan archives with the same tested Conan version.
  CONAN_VERSION: '2.34.0'

jobs:
  # Prepare the SDK once per platform and share its Conan packages. Hoisted out
  # of the plugin matrix so dependencies are not rebuilt for each label variant.
  sdk:
    name: PlotJuggler SDK (${{ matrix.platform.label }})
    runs-on: ${{ matrix.platform.os }}
    container:
      # Keep the SDK and plugin on the same Ubuntu 22.04 libstdc++/glibc floor.
      image: ${{ matrix.platform.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, container: 'ubuntu:22.04', label: ubuntu-22.04 }
          - { os: windows-2022, label: windows-2022 }
    steps:
      - name: Install Linux SDK build tools
        if: runner.os == 'Linux'
        # Install git before checkout; the container runs as root.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates python3 python3-venv zstd
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.11'
      - name: Set up Conan and detect compiler profile
        shell: bash
        run: |
          export CONAN_HOME="${RUNNER_TEMP//\\//}/conan-home"
          if [ "$RUNNER_OS" = "Linux" ]; then
            python3 -m venv "$RUNNER_TEMP/conan-env"
            source "$RUNNER_TEMP/conan-env/bin/activate"
          fi
          python -m pip install "conan==${CONAN_VERSION}"
          conan profile detect
          mkdir -p sdk-cache
          # Conan returns a Windows path on Windows; normalise it for Bash.
          profile="$(conan profile path default)"
          cp "${profile//\\//}" sdk-cache/default.profile
      - name: Cache SDK Conan packages
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: sdk-cache
          # Include the compiler profile, ABI platform, dependency pins and
          # archive version. Label options do not affect the SDK packages.
          key: sdk-v1-${{ matrix.platform.label }}-conan-${{ env.CONAN_VERSION }}-Release-cpp20-${{ hashFiles('conanfile.txt', 'sdk-cache/default.profile') }}
      - name: Prepare pinned SDK and export Conan packages
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export CONAN_HOME="${RUNNER_TEMP//\\//}/conan-home"
          if [ "$RUNNER_OS" = "Linux" ]; then
            source "$RUNNER_TEMP/conan-env/bin/activate"
          fi
          conan remote add plotjuggler https://plotjuggler.jfrog.io/artifactory/api/conan/plotjuggler-conan
          conan install . -of sdk-build --build=missing -s build_type=Release \
            -s compiler.cppstd=20 --lockfile-out=sdk-cache/conan.lock
          # Save packages portably, rather than copying Conan's path-dependent
          # cache database. The isolated Conan home contains only this SDK graph.
          conan cache save '*:*' --no-source --file=sdk-cache/conan-packages.tgz
      - name: Share SDK packages with plugin jobs
        uses: actions/upload-artifact@v7
        with:
          name: ConanSDK-${{ matrix.platform.label }}
          path: sdk-cache/
          if-no-files-found: error

  plugin:
    name: ${{ matrix.config.name }} (${{ matrix.platform.label }})
    needs: sdk
    runs-on: ${{ matrix.platform.os }}
    container:
      image: ${{ matrix.platform.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Use a supported host runner while keeping the Ubuntu 22.04 container's
        # libstdc++/glibc floor. This also matches the default Docker base image.
        platform:
          - { os: ubuntu-latest, container: 'ubuntu:22.04', label: ubuntu-22.04 }
          - { os: windows-2022, label: windows-2022 }
        config:
          - { name: plain, units: 'OFF', rcou: 'OFF' }
          - { name: units, units: 'ON', rcou: 'OFF' }
          - { name: rcou, units: 'OFF', rcou: 'ON' }
          - { name: units-rcou, units: 'ON', rcou: 'ON' }
    steps:
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        # Install git before checkout so it creates a clone rather than falling
        # back to an archive. The container runs as root, so sudo is unnecessary.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates python3 python3-venv qt6-base-dev
      - uses: actions/checkout@v7
      - name: Install Windows Qt 6
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.11'
      - name: Download prepared SDK packages
        uses: actions/download-artifact@v8
        with:
          name: ConanSDK-${{ matrix.platform.label }}
          path: sdk-cache
      - name: Restore SDK packages and generate plugin toolchain
        shell: bash
        run: |
          export CONAN_HOME="${RUNNER_TEMP//\\//}/conan-home"
          # Keep Linux Python isolated from system packages, as in Docker.
          if [ "$RUNNER_OS" = "Linux" ]; then
            python3 -m venv "$RUNNER_TEMP/conan-env"
            source "$RUNNER_TEMP/conan-env/bin/activate"
          fi
          python -m pip install "conan==${CONAN_VERSION}"
          conan cache restore sdk-cache/conan-packages.tgz
          # Use the producer's profile and revisions. Missing packages fail
          # instead of silently downloading or rebuilding the SDK per variant.
          conan install . -of build --build=never --no-remote \
            -pr:h sdk-cache/default.profile -pr:b sdk-cache/default.profile \
            -s build_type=Release -s compiler.cppstd=20 --lockfile=sdk-cache/conan.lock
      - name: Configure and build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release -DADD_UNITS=${{ matrix.config.units }} \
            -DADD_RCOU_FUNCTION_LABELS=${{ matrix.config.rcou }}
          cmake --build build --config Release --parallel 2
      - name: Test plugin and install
        # Check both build and installed binaries so install-time library paths
        # are exercised. Verify every label combination, including plain.
        shell: bash
        run: |
          ctest --test-dir build -C Release --output-on-failure --no-tests=error
          cmake --install build --prefix plugin_install --config Release
          smoketest=build/tests/pj_plugin_smoketest
          if [ "$RUNNER_OS" = "Windows" ]; then
            smoketest=build/tests/Release/pj_plugin_smoketest.exe
          fi
          plugin="$(find plugin_install -type f \( -name '*.so' -o -name '*.dll' \) -print -quit)"
          if [ -z "$plugin" ]; then
            echo "No installed plugin library found" >&2
            exit 1
          fi
          expect=(--verify)
          if [ "${{ matrix.config.units }}" = "ON" ]; then expect+=(--expect-units); fi
          if [ "${{ matrix.config.rcou }}" = "ON" ]; then expect+=(--expect-rcou); fi
          "$smoketest" "$plugin" tests/logs/00000001.BIN "${expect[@]}"
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: DataAPBin-${{ matrix.platform.label }}-${{ matrix.config.name }}
          path: plugin_install/
          if-no-files-found: error

  release:
    name: Draft release
    needs: plugin
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Download all plugin artifacts
        uses: actions/download-artifact@v8
        with:
          # SDK transfer artifacts contain dependencies, not release plugins.
          pattern: DataAPBin-*
          path: artifacts

      # Each artifact holds a single shared library under lib/. Flatten them
      # into uniquely named assets, keeping the real extension so a downloaded
      # asset is still recognisable as a plugin.
      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p assets
          for dir in artifacts/*/; do
            variant="$(basename "$dir")"
            variant="${variant#DataAPBin-}"
            # -print -quit rather than piping to head: under `set -o pipefail` a
            # closed pipe would make find fail the whole step.
            lib="$(find "$dir" -type f \( -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) -print -quit)"
            if [ -z "$lib" ]; then
              echo "No plugin library found in $dir" >&2
              exit 1
            fi
            case "$lib" in
              *.dll) cp "$lib" "assets/DataAPBin-$variant.dll" ;;
              *)     cp "$lib" "assets/libDataAPBin-$variant.${lib##*.}" ;;
            esac
          done
          ls -l assets

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: assets/*
          fail_on_unmatched_files: true
