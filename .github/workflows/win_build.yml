name: Build PlotJuggler & Plugin

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout plugin
      uses: actions/checkout@v4

    - name: Install Conan
      uses: turtlebrowser/get-conan@main

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        arch: 'win64_msvc2019_64'

    - name: Cache Conan
      uses: actions/cache@v4
      with:
        path: ~/.conan2/
        key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.txt') }}

    - name: Detect Conan profile
      shell: pwsh
      run: conan profile detect

    - name: Conan install
      shell: pwsh
      run: |
        conan install . -of build --build=missing -pr:b=default `
          -s build_type=Release -s compiler.cppstd=20 `
          -c tools.build:jobs=$([Environment]::ProcessorCount) `
          -c tools.cmake.cmaketoolchain:generator=Ninja

    - name: Cache PlotJuggler install
      id: cache-plotjuggler
      uses: actions/cache@v4
      with:
        path: pj_install/
        key: ${{ runner.os }}-plotjuggler-${{ hashFiles('plotjuggler/**') }}

    - name: Clone PlotJuggler
      if: steps.cache-plotjuggler.outputs.cache-hit != 'true'
      run: git clone --depth 1 --branch 3.9.2 https://github.com/facontidavide/PlotJuggler.git plotjuggler

    - name: Configure PlotJuggler
      if: steps.cache-plotjuggler.outputs.cache-hit != 'true'
      shell: pwsh
      run: cmake -S plotjuggler -B pj_build -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\pj_install -DCMAKE_BUILD_TYPE=RelWithDebInfo

    - name: Build & install PlotJuggler
      if: steps.cache-plotjuggler.outputs.cache-hit != 'true'
      shell: pwsh
      run: cmake --build pj_build --config RelWithDebInfo --target install --parallel $([Environment]::ProcessorCount)

    - name: Clean plugin build directory
      shell: pwsh
      run: Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue

    - name: Configure plugin
      shell: pwsh
      run: cmake -S . -B build -Dplotjuggler_DIR="${{ github.workspace }}\pj_install\lib\cmake\plotjuggler" -DADD_UNITS=OFF

    - name: Build plugin
      shell: pwsh
      run: cmake --build build --config Release --parallel $([Environment]::ProcessorCount)

    - name: Install plugin
      shell: pwsh
      run: cmake --install build --prefix "${{ github.workspace }}\plugin_install"

    - name: Upload plugin artifact
      uses: actions/upload-artifact@v4
      with:
        name: plugin-build
        path: build/